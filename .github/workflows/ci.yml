name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (default, pcap tag, windows target)
        run: |
          go vet ./...
          go vet -tags pcap ./...
          GOOS=windows go vet ./...
      - name: test
        run: go test -race -count=1 -tags pcap ./...
      - name: build
        run: |
          go build ./...
          go build -tags pcap ./...
          GOOS=windows go build -o /dev/null ./cmd/agent
      - name: smoke (synthetic 60k pps for 3 s)
        run: |
          go run ./cmd/agent --synth --pps 60000 --addr 127.0.0.1:18080 --duration 3s 2>&1 | tee agent.log
          grep -q ' k=2 ' agent.log

  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang + libbpf headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
      - name: compile bpf/xdp.c
        run: |
          clang -O2 -g -Wall -Werror -target bpf -I/usr/include/$(uname -m)-linux-gnu -c bpf/xdp.c -o bpf/xdp.o
          llvm-objdump -h bpf/xdp.o | grep -E 'xdp|\.maps'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
